backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "news"
    label: "News & Stories"
    folder: "_posts/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select",
          options: ["Environment", "Animal Protection", "Empowering Women", "Training Centre", "General"] }
      - { label: "Cover Photo", name: "image", widget: "image", required: false }
      - { label: "Summary", name: "excerpt", widget: "text" }
      - { label: "Full Story", name: "body", widget: "markdown" }
      - { label: "Featured?", name: "featured", widget: "boolean", default: false }
