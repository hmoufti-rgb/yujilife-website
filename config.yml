# ============================================================
# Decap CMS Configuration for yujilife.org
# ============================================================

backend:
  name: git-gateway
  branch: main

# Where uploaded photos/images are stored in the repo
media_folder: "images/uploads"
public_folder: "/images/uploads"

# ── COLLECTIONS ────────────────────────────────────────────
# Each collection is a content type you can manage in the admin panel

collections:

  # ── NEWS & STORIES ──────────────────────────────────────
  - name: "news"
    label: "News & Stories"
    label_singular: "News Post"
    folder: "_posts/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title",       name: "title",       widget: "string",   hint: "The headline of the news post" }
      - { label: "Date",        name: "date",         widget: "datetime", hint: "Publication date" }
      - { label: "Category",    name: "category",     widget: "select",
          options: ["Environment", "Animal Protection", "Empowering Women", "Training Centre", "General"] }
      - { label: "Cover Photo", name: "image",        widget: "image",    required: false, hint: "Upload a photo for this post" }
      - { label: "Summary",     name: "excerpt",      widget: "text",     hint: "Short description shown on the homepage (1-2 sentences)" }
      - { label: "Full Story",  name: "body",         widget: "markdown", hint: "The full news article" }
      - { label: "Featured?",   name: "featured",     widget: "boolean",  default: false, hint: "Show this post as the featured (large) card on the homepage" }

  # ── PROGRAMS ────────────────────────────────────────────
  - name: "programs"
    label: "Programs"
    label_singular: "Program"
    folder: "_data/programs"
    create: false
    files:
      - label: "Environment"
        name: "environment"
        file: "_data/programs/environment.yml"
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Subtitle",    name: "subtitle", widget: "string" }
          - { label: "Description", name: "desc",     widget: "text" }
          - label: "Bullet Points"
            name: "bullets"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }

      - label: "Animal Protection"
        name: "animal"
        file: "_data/programs/animal.yml"
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Subtitle",    name: "subtitle", widget: "string" }
          - { label: "Description", name: "desc",     widget: "text" }
          - label: "Bullet Points"
            name: "bullets"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }

      - label: "Empowering Women"
        name: "women"
        file: "_data/programs/women.yml"
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Subtitle",    name: "subtitle", widget: "string" }
          - { label: "Description", name: "desc",     widget: "text" }
          - label: "Bullet Points"
            name: "bullets"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }

      - label: "Training Centre"
        name: "centre"
        file: "_data/programs/centre.yml"
        fields:
          - { label: "Title",       name: "title",   widget: "string" }
          - { label: "Subtitle",    name: "subtitle", widget: "string" }
          - { label: "Description", name: "desc",     widget: "text" }
          - label: "Bullet Points"
            name: "bullets"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }

  # ── SITE SETTINGS ───────────────────────────────────────
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.yml"
        fields:
          - { label: "Site Tagline",     name: "tagline",     widget: "string", hint: "Shown in the hero section" }
          - { label: "Hero Description", name: "hero_desc",   widget: "text",   hint: "Paragraph below the hero title" }
          - { label: "Contact Email",    name: "email",       widget: "string" }
          - { label: "Facebook URL",     name: "facebook",    widget: "string", required: false }
          - { label: "Instagram URL",    name: "instagram",   widget: "string", required: false }
          - { label: "YouTube URL",      name: "youtube",     widget: "string", required: false }

      - label: "Stats Bar"
        name: "stats"
        file: "_data/stats.yml"
        fields:
          - label: "Stats"
            name: "items"
            widget: "list"
            fields:
              - { label: "Number",  name: "number", widget: "string", hint: "e.g. 120+ or 4" }
              - { label: "Label",   name: "label",  widget: "string", hint: "e.g. Women trained" }
